server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

spring:
  application:
    name: smartclock-server
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:smartclock}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC&sessionVariables=time_zone='%2B00:00'
    username: ${DB_USER:smartclock}
    password: ${DB_PASSWORD:smartclock}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  jooq:
    sql-dialect: mysql

management:
  endpoints:
    web:
      exposure:
        include: health,info

smartclock:
  jwt:
    issuer: ${JWT_ISSUER:smartclock-server}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    refresh-pepper: ${JWT_REFRESH_PEPPER:change-me-refresh-pepper}

logging:
  level:
    root: INFO
