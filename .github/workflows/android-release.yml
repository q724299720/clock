name: Android Release Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Build Debug and Unit Tests
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PWD_ENC: ${{ secrets.DB_PWD_ENC }}
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Upload Debug APK Artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: smartclock-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish Latest Debug APK Release
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          git tag -f debug-latest
          git push -f origin debug-latest
          gh release create debug-latest app/build/outputs/apk/debug/*.apk --title "SmartClock Debug APK" --notes "Auto-built from the latest main branch commit." --prerelease

      - name: Decode Keystore
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build Signed Release APK
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PWD_ENC: ${{ secrets.DB_PWD_ENC }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload Release APK Artifact
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: smartclock-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk

      - name: Cleanup Keystore
        if: always()
        run: rm -f keystore.jks
