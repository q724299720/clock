<!DOCTYPE html>

<html lang="en"><head>

<title>Template Center</title>

                    "surface-container-high": "#e7e7f3",

                    "on-error-container": "#93000a",
                    "on-primary-fixed-variant": "#003ea8",
                    "surface-variant": "#e1e2ed",
                    "surface-container-highest": "#e1e2ed",
                    "on-primary-container": "#eeefff",

            "spacing": {
                    "grid-gutter": "1rem",

            "fontFamily": {
                    "body-lg": [

                    "body-md": [

                    "headline-lg": [
                            "Hanken Grotesk"
                    ],
                    "headline-lg-mobile": [

                    "label-caps": [

            "fontSize": {

<style>
        body {
            background-color: #f4f7fb; /* Overriding for specific requested bg */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="text-on-surface antialiased flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background w-full top-0 sticky border-b border-outline-variant dark:border-outline-variant z-40">
<div class="flex items-center justify-between px-container-padding h-16 w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" style="font-variation-settings: 'FILL' 1;">alarm</span>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Timely</span>
</div>
<div class="flex items-center gap-4">
<!-- Optional actions could go here -->
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow pb-24 pt-6 px-container-padding max-w-screen-md mx-auto w-full">
<div class="mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">模板</h1>
<p class="font-body-md text-body-md text-on-surface-variant">用模板快速创建中国生活提醒</p>
</div>
<div class="flex flex-col gap-stack-gap">
<!-- Card 1 -->
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant rounded-xl p-card-padding hover:shadow-sm transition-shadow active:scale-[0.98] duration-100 group">
<div class="mb-3">
<span class="material-symbols-outlined text-primary text-[28px] group-hover:text-primary-container transition-colors" style="font-variation-settings: 'FILL' 1;">cake</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">生日管家</h3>
<p class="font-body-md text-body-md text-on-surface-variant">每年提醒，支持公历和农历日期</p>
</button>
<!-- Card 2 -->
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant rounded-xl p-card-padding hover:shadow-sm transition-shadow active:scale-[0.98] duration-100 group">
<div class="mb-3">
<span class="material-symbols-outlined text-primary text-[28px] group-hover:text-primary-container transition-colors" style="font-variation-settings: 'FILL' 1;">work</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">法定工作日提醒</h3>
<p class="font-body-md text-body-md text-on-surface-variant">按中国调休规则提醒，补班日也会响</p>
</button>
<!-- Card 3 -->
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant rounded-xl p-card-padding hover:shadow-sm transition-shadow active:scale-[0.98] duration-100 group">
<div class="mb-3">
<span class="material-symbols-outlined text-primary text-[28px] group-hover:text-primary-container transition-colors" style="font-variation-settings: 'FILL' 1;">credit_card</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">还信用卡</h3>
<p class="font-body-md text-body-md text-on-surface-variant">每月固定日期提醒，适合还款日</p>
</button>
<!-- Card 4 -->
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant rounded-xl p-card-padding hover:shadow-sm transition-shadow active:scale-[0.98] duration-100 group">
<div class="mb-3">
<span class="material-symbols-outlined text-primary text-[28px] group-hover:text-primary-container transition-colors" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">交房租</h3>
<p class="font-body-md text-body-md text-on-surface-variant">按每两个月一次的节奏提醒</p>
</button>
<!-- Card 5 -->
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant rounded-xl p-card-padding hover:shadow-sm transition-shadow active:scale-[0.98] duration-100 group">
<div class="mb-3">
<span class="material-symbols-outlined text-primary text-[28px] group-hover:text-primary-container transition-colors" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">按时吃药</h3>
<p class="font-body-md text-body-md text-on-surface-variant">每日定时提醒，关爱健康</p>
</button>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-4 bg-surface dark:bg-surface border-t border-outline-variant z-50 h-16">
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim p-2 hover:bg-secondary-container/30 dark:hover:bg-secondary-container/30 rounded-full transition-all active:scale-90 duration-200 group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors">notifications</span>
<span class="font-label-caps text-label-caps mt-1 hidden">Reminders</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim p-2 hover:bg-secondary-container/30 dark:hover:bg-secondary-container/30 rounded-full transition-all active:scale-90 duration-200 group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors">calendar_month</span>
<span class="font-label-caps text-label-caps mt-1 hidden">Calendar</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full p-2 w-12 h-12 active:scale-90 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard_customize</span>
<span class="font-label-caps text-label-caps mt-1 hidden">Templates</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim p-2 hover:bg-secondary-container/30 dark:hover:bg-secondary-container/30 rounded-full transition-all active:scale-90 duration-200 group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors">settings</span>
<span class="font-label-caps text-label-caps mt-1 hidden">Settings</span>
</button>
</nav>
</body></html>
