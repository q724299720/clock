    body {
      min-height: max(884px, 100dvh);

<body class="bg-background min-h-screen text-on-background font-body-md pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background border-b border-outline-variant z-40 hidden md:block">
<div class="flex items-center justify-between px-container-padding h-16 w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:bg-surface-variant/50 transition-colors active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="alarm">alarm</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Timely</h1>
</div>
<nav class="flex items-center gap-2">
<a class="flex flex-col items-center justify-center px-4 py-2 rounded-full bg-primary-container text-on-primary-container transition-colors active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined fill" data-icon="notifications" data-weight="fill">notifications</span>
</a>
<a class="flex flex-col items-center justify-center px-4 py-2 rounded-full text-on-surface-variant hover:bg-surface-variant/50 transition-colors active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
</a>
<a class="flex flex-col items-center justify-center px-4 py-2 rounded-full text-on-surface-variant hover:bg-surface-variant/50 transition-colors active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="dashboard_customize">dashboard_customize</span>
</a>
<a class="flex flex-col items-center justify-center px-4 py-2 rounded-full text-on-surface-variant hover:bg-surface-variant/50 transition-colors active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</a>
</nav>
</div>
</header>
<!-- Mobile Header (Visible only on md:hidden) -->
<div class="md:hidden pt-8 pb-4 px-container-padding">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">提醒</h1>
</div>
<!-- Main Content -->
<main class="max-w-screen-md mx-auto px-container-padding space-y-6 pt-4 md:pt-8">
<!-- Info Card -->
<div class="bg-surface-container-low rounded-xl p-card-padding border border-outline-variant">
<div class="flex justify-between items-start mb-2">
<h2 class="font-headline-md text-headline-md text-on-surface">提醒箱</h2>
<span class="text-primary font-body-md font-semibold">1 条</span>
</div>
<p class="font-body-md text-on-surface-variant">左右滑动即可删除，点卡片可编辑，开关控制启用状态。</p>
</div>
<!-- Filter Chips -->
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-lg bg-primary-container text-on-primary-container font-body-md transition-colors border border-transparent">全部</button>
<button class="px-4 py-2 rounded-lg bg-surface text-on-surface font-body-md border border-outline-variant hover:bg-surface-variant/50 transition-colors">今天</button>
<button class="px-4 py-2 rounded-lg bg-surface text-on-surface font-body-md border border-outline-variant hover:bg-surface-variant/50 transition-colors">纪念日</button>
<button class="px-4 py-2 rounded-lg bg-surface text-on-surface font-body-md border border-outline-variant hover:bg-surface-variant/50 transition-colors">倒计时</button>
</div>
<!-- Reminder List -->
<div class="space-y-stack-gap">
<!-- Alarm Card -->
<div class="bg-surface rounded-xl p-card-padding border border-outline-variant shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group">
<div class="flex justify-between items-start">
<div>
<div class="flex items-center gap-3 mb-1">
<span class="font-display-time text-headline-lg text-primary tracking-tight">13:37</span>
<div class="flex gap-2 mt-1">
<span class="px-2 py-0.5 rounded bg-primary-container text-on-primary-container text-sm font-medium">单次</span>
<span class="px-2 py-0.5 rounded bg-surface-variant text-on-surface-variant text-sm font-medium">已关闭</span>
</div>
</div>
<h3 class="font-body-lg text-on-surface mb-1">闹钟</h3>
<p class="font-body-md text-on-surface-variant">2026-06-06 13:37</p>
</div>
<!-- Custom Toggle -->
<label class="relative inline-flex items-center cursor-pointer mt-2">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-14 h-8 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-white after:border-outline-variant after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary border border-outline-variant"></div>
</label>
</div>
</div>
<!-- Mock Card 2 -->
<div class="bg-surface rounded-xl p-card-padding border border-outline-variant shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group">
<div class="flex justify-between items-start">
<div>
<div class="flex items-center gap-3 mb-1">
<span class="font-display-time text-headline-lg text-on-surface tracking-tight">07:00</span>
<div class="flex gap-2 mt-1">
<span class="px-2 py-0.5 rounded bg-secondary-container text-on-secondary-container text-sm font-medium">工作日</span>
</div>
</div>
<h3 class="font-body-lg text-on-surface mb-1">起床</h3>
<p class="font-body-md text-on-surface-variant">每天 07:00</p>
</div>
<!-- Custom Toggle Active -->
<label class="relative inline-flex items-center cursor-pointer mt-2">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-14 h-8 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-white after:border-outline-variant after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary border border-outline-variant"></div>
</label>
</div>
</div>
</div>
</main>
<!-- Floating Action Button -->
<button class="fixed bottom-24 right-6 md:bottom-10 md:right-10 w-14 h-14 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center shadow-lg hover:bg-primary hover:text-on-primary transition-all active:scale-90 z-40">
<span class="material-symbols-outlined text-3xl" data-icon="add">add</span>
</button>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-4 bg-surface border-t border-outline-variant z-50 h-16 pb-safe">
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full p-2 w-16 h-12 transition-all" href="#">
<span class="material-symbols-outlined fill" data-icon="notifications" data-weight="fill">notifications</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary p-2 hover:bg-secondary-container/30 rounded-full transition-all" href="#">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary p-2 hover:bg-secondary-container/30 rounded-full transition-all" href="#">
<span class="material-symbols-outlined" data-icon="dashboard_customize">dashboard_customize</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary p-2 hover:bg-secondary-container/30 rounded-full transition-all" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</a>
</nav>
<style>
        /* iOS Safe Area Support */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
            height: calc(4rem + env(safe-area-inset-bottom)); /* 16 * 0.25rem = 4rem */
