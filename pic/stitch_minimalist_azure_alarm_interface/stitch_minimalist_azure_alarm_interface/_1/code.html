<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen pb-20">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background border-b border-outline-variant z-40">
<div class="flex items-center justify-between px-container-padding h-16 w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">alarm</span>
<span class="font-headline-md text-headline-md font-bold text-primary">Timely</span>
</div>
<!-- Top App Bar Navigation for Web -->
<nav class="hidden md:flex items-center gap-6">
<a class="text-on-surface-variant font-body-md hover:bg-surface-variant/50 px-3 py-2 rounded-md transition-colors active:scale-95 duration-100" href="#">提醒</a>
<a class="text-on-surface-variant font-body-md hover:bg-surface-variant/50 px-3 py-2 rounded-md transition-colors active:scale-95 duration-100" href="#">日历</a>
<a class="text-on-surface-variant font-body-md hover:bg-surface-variant/50 px-3 py-2 rounded-md transition-colors active:scale-95 duration-100" href="#">模板</a>
<a class="text-primary font-body-md hover:bg-surface-variant/50 px-3 py-2 rounded-md transition-colors active:scale-95 duration-100" href="#">设置</a>
</nav>
</div>
</header>
<main class="max-w-screen-md mx-auto px-container-padding py-8 space-y-stack-gap">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg mb-8">设置</h1>
<!-- Usage Mode Section -->
<section class="space-y-4">
<h2 class="font-headline-md text-headline-md text-on-surface">使用模式</h2>
<!-- Local Mode Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-card-padding">
<h3 class="font-headline-md text-headline-md mb-2">当前为本地模式</h3>
<p class="font-body-md text-on-surface-variant">现在不需要登录，提醒和记录只保存在本机。</p>
</div>
<!-- Login Link -->
<button class="w-full text-left py-4 border-b border-outline-variant font-body-md text-primary active:scale-[0.98] transition-transform">
                登录并开启云同步
            </button>
</section>
<!-- Permissions Section -->
<section class="space-y-4 mt-8">
<h2 class="font-headline-md text-headline-md text-on-surface">权限自检</h2>
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
<div class="flex items-center justify-between p-4 border-b border-outline-variant min-h-[48px]">
<span class="font-body-md">精确闹钟权限</span>
<span class="font-body-md text-[#16a34a]">已开启</span>
</div>
<div class="flex items-center justify-between p-4 border-b border-outline-variant min-h-[48px]">
<span class="font-body-md">全屏提醒权限</span>
<span class="font-body-md text-[#16a34a]">已开启</span>
</div>
<div class="flex items-center justify-between p-4 border-b border-outline-variant min-h-[48px]">
<span class="font-body-md">通知权限</span>
<span class="font-body-md text-[#16a34a]">已开启</span>
</div>
<div class="flex items-center justify-between p-4 border-b border-outline-variant min-h-[48px]">
<span class="font-body-md">悬浮窗权限</span>
<span class="font-body-md text-[#16a34a]">已开启</span>
</div>
<div class="flex items-center justify-between p-4 min-h-[48px]">
<span class="font-body-md">电池优化白名单</span>
<span class="font-body-md text-[#16a34a]">已开启</span>
</div>
</div>
<!-- Summary Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-card-padding mt-4">
<h3 class="font-headline-md text-headline-md mb-2">关键权限已就绪</h3>
<p class="font-body-md text-on-surface-variant">精确闹钟、通知、悬浮窗和电池优化相关权限已配置完毕，确保应用能正常工作。</p>
</div>
</section>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-4 bg-surface border-t border-outline-variant z-50 h-16">

<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="font-label-caps text-label-caps mt-1 hidden">提醒</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary p-2 hover:bg-secondary-container/30 rounded-full transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
<span class="font-label-caps text-label-caps mt-1 hidden">日历</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary p-2 hover:bg-secondary-container/30 rounded-full transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="dashboard_customize">dashboard_customize</span>
<span class="font-label-caps text-label-caps mt-1 hidden">模板</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full p-2 w-12 h-12 hover:bg-secondary-container/30 transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="settings" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-caps text-label-caps mt-1 hidden">设置</span>
</a>
</nav>
